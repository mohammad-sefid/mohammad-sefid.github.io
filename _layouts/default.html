<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  {% seo %}

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">

  <style>

    :root {
      --bg: #ffffff;
      --text: #222222;
      --heading: #111111;
      --link: #267cb9;
      --border: #e5e5e5;
    }

    body.dark-mode {
      --bg: #0d1117;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --link: #58a6ff;
      --border: #30363d;
    }

    html,
    body {
      background-color: var(--bg) !important;
      color: var(--text) !important;
      transition: background-color 0.3s ease,
                  color 0.3s ease;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--heading) !important;
    }

    a {
      color: var(--link);
    }

    .wrapper {
      min-height: 100vh;
    }

    .profile-photo img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin-bottom: 20px;
    }

    .description {
      color: #6daedb;
      line-height: 1.6;
    }

    .social-links {
      margin-top: 20px;
    }

    .social-links a {
      display: inline-block;
      margin-right: 8px;
    }

    /* ON/OFF SWITCH */

    .theme-switch-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
    }

    .theme-switch {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
    }

    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background-color: #ccc;
      border-radius: 28px;
      transition: 0.3s;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    .theme-switch input:checked + .slider {
      background-color: #2196f3;
    }

    .theme-switch input:checked + .slider:before {
      transform: translateX(24px);
    }

    .theme-status {
      font-weight: 500;
    }

  </style>
</head>

<body>

<div class="wrapper">

  <main>

    {{ content }}

    <div class="theme-switch-container">

      <span>☀️</span>

      <label class="theme-switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>

      <span>🌙</span>

      <span class="theme-status" id="themeStatus">
        Light
      </span>

    </div>

  </main>

</div>

<script>

const toggle = document.getElementById("themeToggle");
const status = document.getElementById("themeStatus");

function setTheme(theme) {

  if (theme === "dark") {
    document.body.classList.add("dark-mode");
    toggle.checked = true;
    status.textContent = "Dark";
  } else {
    document.body.classList.remove("dark-mode");
    toggle.checked = false;
    status.textContent = "Light";
  }

  localStorage.setItem("theme", theme);
}

const savedTheme = localStorage.getItem("theme") || "light";

setTheme(savedTheme);

toggle.addEventListener("change", function () {

  if (toggle.checked) {
    setTheme("dark");
  } else {
    setTheme("light");
  }

});

</script>

</body>
</html>
