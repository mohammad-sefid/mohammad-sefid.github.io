<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>

  {% if site.google_analytics %}
  <script>
    (function(i,s,o,g,r,a,m){
      i['GoogleAnalyticsObject']=r;
      i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments);
      };
      i[r].l=1*new Date();
      a=s.createElement(o);
      m=s.getElementsByTagName(o)[0];
      a.async=1;
      a.src=g;
      m.parentNode.insertBefore(a,m);
    })(window,document,'script',
      'https://www.google-analytics.com/analytics.js','ga');

    ga('create', '{{ site.google_analytics }}', 'auto');
    ga('send', 'pageview');
  </script>
  {% endif %}

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% seo %}

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

  <style>

    /* =====================================================
       LIGHT / DARK MODE
       ===================================================== */

    :root {
      --bg: #ffffff;
      --text: #24292f;
      --heading: #0969da;
      --link: #267cb9;
      --border: #d8dee4;
      --card: #f6f8fa;
      --muted: #6daedb;
    }

    html.dark-mode {
      --bg: #0d1117;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --link: #58a6ff;
      --border: #30363d;
      --card: #161b22;
      --muted: #79c0ff;
    }

    html {
      background-color: var(--bg);
      transition: background-color 0.3s ease;
    }

    body {
      background-color: var(--bg) !important;
      color: var(--text) !important;
      transition:
        background-color 0.3s ease,
        color 0.3s ease;
    }

    .wrapper {
      background-color: var(--bg);
      transition: background-color 0.3s ease;
    }

    section,
    header,
    footer {
      color: var(--text);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: var(--heading) !important;
      transition: color 0.3s ease;
    }

    p,
    li,
    strong,
    em {
      color: var(--text);
    }

    a {
      color: var(--link) !important;
    }

    hr {
      border-color: var(--border) !important;
    }

    code,
    pre {
      background-color: var(--card) !important;
      color: var(--text) !important;
    }

    blockquote {
      border-left-color: var(--border) !important;
    }


    /* =====================================================
       DESCRIPTION
       ===================================================== */

    .profile-description {
      color: var(--muted) !important;
      line-height: 1.6;
    }


    /* =====================================================
       PROFILE PHOTO
       ===================================================== */

    .profile-photo {
      margin: 0 0 20px 0;
    }

    .profile-photo img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid var(--border);
    }


    /* =====================================================
       SOCIAL BUTTONS
       ===================================================== */

    .social-links {
      margin-top: 20px;
      margin-bottom: 25px;
    }

    .social-links a {
      display: inline-block;
      margin-right: 8px;
      margin-bottom: 8px;
      text-decoration: none;
    }

    .social-links img {
      vertical-align: middle;
    }


    /* =====================================================
       LIGHT / DARK TOGGLE
       ===================================================== */

    .theme-switch-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 25px;
      margin-bottom: 25px;
      color: var(--text);
      font-size: 14px;
    }

    .theme-switch {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 30px;
    }

    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background-color: #b8bec5;
      border-radius: 30px;
      transition: 0.3s ease;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 3px;
      top: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.3s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
    }

    .theme-switch input:checked + .slider {
      background-color: #2196f3;
    }

    .theme-switch input:checked + .slider:before {
      transform: translateX(24px);
    }

    .theme-label {
      min-width: 45px;
      font-weight: 600;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    footer {
      color: var(--text);
      transition: color 0.3s ease;
    }

  </style>

</head>


<body>

  <div class="wrapper">

    <header>

      {% if site.logo %}
        <img src="{{ site.logo | relative_url }}" alt="Logo">
      {% endif %}

      {% if site.title %}
        <h1>{{ site.title }}</h1>
      {% endif %}

      {% if site.description %}
        <p class="profile-description">
          {{ site.description }}
        </p>
      {% endif %}

      <!-- LIGHT / DARK SWITCH -->

      <div class="theme-switch-container">

        <span aria-hidden="true">☀️</span>

        <label class="theme-switch" aria-label="Toggle dark mode">

          <input type="checkbox" id="themeToggle">

          <span class="slider"></span>

        </label>

        <span aria-hidden="true">🌙</span>

        <span class="theme-label" id="themeStatus">
          Light
        </span>

      </div>

    </header>


    <!-- =================================================
         MAIN PAGE CONTENT
         ================================================= -->

    <section>

      {{ content }}

    </section>


    <footer>

      <p>
        Hosted on
        <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">
          GitHub Pages
        </a>
      </p>

    </footer>

  </div>


  <!-- ===================================================
       DARK / LIGHT MODE JAVASCRIPT
       =================================================== -->

  <script>

    (function () {

      const toggle = document.getElementById("themeToggle");
      const status = document.getElementById("themeStatus");

      if (!toggle || !status) {
        return;
      }

      function applyTheme(theme) {

        if (theme === "dark") {

          document.documentElement.classList.add("dark-mode");
          toggle.checked = true;
          status.textContent = "Dark";

        } else {

          document.documentElement.classList.remove("dark-mode");
          toggle.checked = false;
          status.textContent = "Light";

        }

        localStorage.setItem("theme", theme);
      }


      /* Load saved theme */

      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === "dark") {

        applyTheme("dark");

      } else {

        applyTheme("light");

      }


      /* Toggle theme */

      toggle.addEventListener("change", function () {

        if (this.checked) {

          applyTheme("dark");

        } else {

          applyTheme("light");

        }

      });

    })();

  </script>

</body>

</html>
